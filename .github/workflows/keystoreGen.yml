name: Generate & Setup Keystore

on:
  workflow_dispatch:
    inputs:
      keystore_alias:
        description: 'Keystore Alias Name'
        required: true
        default: 'android_key'
      keystore_password:
        description: 'Keystore Password'
        required: true
        type: password
      key_password:
        description: 'Key Password (leave empty if same as keystore)'
        required: false
        type: password
      validity_days:
        description: 'Certificate Validity (days)'
        required: true
        default: '10000'
      common_name:
        description: 'Common Name (CN)'
        required: true
        default: 'Android Developer'
      organization:
        description: 'Organization (O)'
        required: true
        default: 'Developer'
      organization_unit:
        description: 'Organization Unit (OU)'
        required: true
        default: 'Development'
      locality:
        description: 'Locality/City (L)'
        required: true
        default: 'Indonesia'
      state:
        description: 'State/Province (S)'
        required: true
        default: 'Indonesia'
      country:
        description: 'Country Code (C) - 2 letters'
        required: true
        default: 'ID'
      auto_add_secrets:
        description: 'Auto add secrets to repository'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  repository-projects: write

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      # ============================================================================
      # SETUP & VALIDATION
      # ============================================================================

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Validate Inputs
        id: validate
        run: |
          echo "🔍 Validating keystore configuration..."
          
          # Validate alias
          if [ -z "${{ github.event.inputs.keystore_alias }}" ]; then
            echo "❌ Keystore alias cannot be empty!"
            exit 1
          fi
          
          # Validate password
          if [ ${#{{ github.event.inputs.keystore_password }} } -lt 6 ]; then
            echo "❌ Password must be at least 6 characters!"
            exit 1
          fi
          
          # Validate validity days
          if ! [[ "${{ github.event.inputs.validity_days }}" =~ ^[0-9]+$ ]]; then
            echo "❌ Validity days must be a number!"
            exit 1
          fi
          
          # Validate country code
          if ! [[ "${{ github.event.inputs.country }}" =~ ^[A-Z]{2}$ ]]; then
            echo "❌ Country code must be 2 uppercase letters (e.g., ID, US, GB)!"
            exit 1
          fi
          
          echo "✅ All validations passed!"
          echo "validation_passed=true" >> $GITHUB_OUTPUT

      - name: Display Configuration
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║           KEYSTORE GENERATION CONFIGURATION               ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "🔐 KEYSTORE DETAILS"
          echo "────────────────────────────────────────────────────────────"
          echo "  Alias:           ${{ github.event.inputs.keystore_alias }}"
          echo "  Validity:        ${{ github.event.inputs.validity_days }} days"
          echo "  Password:        (hidden)"
          echo "  Auto Add Secrets: ${{ github.event.inputs.auto_add_secrets }}"
          echo ""
          echo "👤 CERTIFICATE INFORMATION"
          echo "────────────────────────────────────────────────────────────"
          echo "  Common Name (CN): ${{ github.event.inputs.common_name }}"
          echo "  Organization (O): ${{ github.event.inputs.organization }}"
          echo "  Org Unit (OU):    ${{ github.event.inputs.organization_unit }}"
          echo "  Locality (L):     ${{ github.event.inputs.locality }}"
          echo "  State (S):        ${{ github.event.inputs.state }}"
          echo "  Country (C):      ${{ github.event.inputs.country }}"
          echo ""

      # ============================================================================
      # KEYSTORE GENERATION
      # ============================================================================

      - name: Generate Keystore
        id: generate
        run: |
          echo "🔑 Generating keystore..."
          
          # Set key password (use keystore password if not provided)
          KEY_PASSWORD="${{ github.event.inputs.key_password }}"
          if [ -z "$KEY_PASSWORD" ]; then
            KEY_PASSWORD="${{ github.event.inputs.keystore_password }}"
            echo "ℹ️  Using keystore password for key password"
          fi
          
          # Generate keystore
          keytool -genkey -v \
            -keystore app/release.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity ${{ github.event.inputs.validity_days }} \
            -alias "${{ github.event.inputs.keystore_alias }}" \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=${{ github.event.inputs.common_name }},OU=${{ github.event.inputs.organization_unit }},O=${{ github.event.inputs.organization }},L=${{ github.event.inputs.locality }},S=${{ github.event.inputs.state }},C=${{ github.event.inputs.country }}"
          
          if [ $? -eq 0 ]; then
            echo "✅ Keystore generated successfully"
            echo "keystore_generated=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Failed to generate keystore!"
            exit 1
          fi

      - name: Verify Keystore
        run: |
          echo "📋 Verifying keystore..."
          
          keytool -list -v \
            -keystore app/release.jks \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -alias "${{ github.event.inputs.keystore_alias }}" | head -20
          
          if [ $? -eq 0 ]; then
            echo "✅ Keystore verification passed"
          else
            echo "❌ Keystore verification failed!"
            exit 1
          fi

      - name: Encode Keystore to Base64
        id: encode
        run: |
          echo "🔄 Encoding keystore to Base64..."
          
          KEYSTORE_BASE64=$(base64 -w 0 < app/release.jks)
          echo "keystore_base64=$KEYSTORE_BASE64" >> $GITHUB_OUTPUT
          
          # Count character length for info
          KEYSTORE_LENGTH=${#KEYSTORE_BASE64}
          echo "ℹ️  Base64 keystore size: $KEYSTORE_LENGTH characters"

      - name: Create Keystore Documentation
        run: |
          cat > KEYSTORE_INFO.md << 'EOF'
          # Keystore Information

          ## ⚠️ IMPORTANT - KEEP THIS SECRET

          This file documents your keystore configuration. **Never commit keystore credentials to version control!**

          ### Keystore Details

          | Property | Value |
          |----------|-------|
          | **Filename** | `app/release.jks` |
          | **Alias** | `${{ github.event.inputs.keystore_alias }}` |
          | **Validity** | ${{ github.event.inputs.validity_days }} days |
          | **Key Algorithm** | RSA |
          | **Key Size** | 2048 bits |
          | **Generated** | $(date) |

          ### Certificate Information

          | Property | Value |
          |----------|-------|
          | **Common Name (CN)** | `${{ github.event.inputs.common_name }}` |
          | **Organization (O)** | `${{ github.event.inputs.organization }}` |
          | **Org Unit (OU)** | `${{ github.event.inputs.organization_unit }}` |
          | **Locality (L)** | `${{ github.event.inputs.locality }}` |
          | **State (S)** | `${{ github.event.inputs.state }}` |
          | **Country (C)** | `${{ github.event.inputs.country }}` |

          ## 🔐 GitHub Secrets Setup

          You need to add the following secrets to your GitHub repository:

          ### 1. KEYSTORE_BASE64
          - **Type:** Encrypted Secret
          - **Value:** (Base64 encoded keystore - see below)
          - **Usage:** Store the keystore file securely

          ### 2. KEYSTORE_ALIAS
          - **Type:** String
          - **Value:** `${{ github.event.inputs.keystore_alias }}`
          - **Usage:** Identify the key in the keystore

          ### 3. KEYSTORE_PASSWORD
          - **Type:** Encrypted Secret
          - **Value:** (Your keystore password)
          - **Usage:** Access the keystore file

          ### 4. KEY_PASSWORD
          - **Type:** Encrypted Secret
          - **Value:** (Your key password - or same as keystore password)
          - **Usage:** Access the specific key

          ## 📋 How to Add Secrets

          1. Go to: **Settings → Secrets and variables → Actions**
          2. Click **New repository secret**
          3. Add each secret with the values above

          ## 🔧 Using Keystore in Build

          In your `build-apk.yml` workflow, the keystore is used like this:

          ```yaml
          - name: Build Release APK (Signed)
            run: |
              echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
              ./gradlew assembleRelease \
                -Pandroid.injected.signing.store.file=$PWD/release.jks \
                -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
                -Pandroid.injected.signing.key.alias="${{ secrets.KEYSTORE_ALIAS }}" \
                -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"
          ```

          ## ⚠️ Security Best Practices

          1. **Never commit keystore files** to version control
          2. **Use GitHub Secrets** for storing passwords
          3. **Rotate keystore** periodically
          4. **Backup keystore** securely offline
          5. **Restrict repository access** to authorized developers only
          6. **Audit secret access** regularly

          ## 📝 Keystore Verification

          To verify your keystore locally:

          ```bash
          keytool -list -v -keystore app/release.jks -storepass <password>
          ```

          ## 🔄 Renew Certificate

          When your certificate expires, you'll need to generate a new keystore:

          ```bash
          keytool -genkey -v \
            -keystore app/release.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias ${{ github.event.inputs.keystore_alias }} \
            -storepass <password> \
            -keypass <password>
          ```

          ---

          **Generated:** $(date)  
          **Repository:** ${{ github.repository }}
          EOF
          
          echo "✅ Keystore documentation created"

      - name: Create .gitignore Entry
        run: |
          # Ensure keystore files are ignored
          if [ ! -f .gitignore ]; then
            cat > .gitignore << 'EOF'
          # Gradle files
          .gradle/
          build/
          *.apk
          *.ap_
          *.dex

          # Keystore files - NEVER COMMIT THESE
          *.jks
          *.keystore
          keystore.b64

          # Local configuration
          local.properties
          EOF
          else
            # Add keystore patterns if not already present
            if ! grep -q "*.jks" .gitignore; then
              cat >> .gitignore << 'EOF'

          # Keystore files - NEVER COMMIT THESE
          *.jks
          *.keystore
          keystore.b64
          EOF
            fi
          fi
          
          echo "✅ .gitignore updated with keystore exclusions"

      # ============================================================================
      # GIT COMMIT & PUSH
      # ============================================================================

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          echo "✅ Git configured"

      - name: Commit Keystore & Documentation
        run: |
          git add app/release.jks KEYSTORE_INFO.md .gitignore
          
          git commit -m "chore: Add keystore and signing configuration

          🔐 KEYSTORE DETAILS
          - Alias: ${{ github.event.inputs.keystore_alias }}
          - Validity: ${{ github.event.inputs.validity_days }} days
          - Algorithm: RSA 2048-bit

          📋 CERTIFICATE
          - CN: ${{ github.event.inputs.common_name }}
          - O: ${{ github.event.inputs.organization }}
          - Country: ${{ github.event.inputs.country }}

          ⚠️  IMPORTANT
          - Add KEYSTORE_BASE64 secret to repository settings
          - Add KEYSTORE_ALIAS, KEYSTORE_PASSWORD, KEY_PASSWORD secrets
          - Never commit keystore files to version control

          ✅ See KEYSTORE_INFO.md for setup instructions"
          
          if [ $? -eq 0 ]; then
            echo "✅ Changes committed"
          else
            echo "❌ Commit failed!"
            exit 1
          fi

      - name: Push to Repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
          
          if [ $? -eq 0 ]; then
            echo "✅ Changes pushed to repository"
          else
            echo "❌ Push failed!"
            exit 1
          fi

      # ============================================================================
      # OUTPUT & SUMMARY
      # ============================================================================

      - name: Generate Setup Instructions
        run: |
          cat > SETUP_SECRETS.txt << 'EOF'
          ╔════════════════════════════════════════════════════════════╗
          ║    KEYSTORE SETUP INSTRUCTIONS - GITHUB SECRETS           ║
          ╚════════════════════════════════════════════════════════════╝

          🚨 NEXT STEPS - ADD GITHUB SECRETS

          1. Go to: https://github.com/${{ github.repository }}/settings/secrets/actions

          2. Click "New repository secret" for each secret below

          ════════════════════════════════════════════════════════════

          SECRET 1: KEYSTORE_BASE64
          ────────────────────────────────────────────────────────────
          Name:  KEYSTORE_BASE64
          Value: (Copy from below)

          ${{ steps.encode.outputs.keystore_base64 }}

          ════════════════════════════════════════════════════════════

          SECRET 2: KEYSTORE_ALIAS
          ────────────────────────────────────────────────────────────
          Name:  KEYSTORE_ALIAS
          Value: ${{ github.event.inputs.keystore_alias }}

          ════════════════════════════════════════════════════════════

          SECRET 3: KEYSTORE_PASSWORD
          ────────────────────────────────────────────────────────────
          Name:  KEYSTORE_PASSWORD
          Value: (Use your keystore password)

          ════════════════════════════════════════════════════════════

          SECRET 4: KEY_PASSWORD
          ────────────────────────────────────────────────────────────
          Name:  KEY_PASSWORD
          Value: (Use your key password or same as keystore password)

          ════════════════════════════════════════════════════════════

          ✅ VERIFICATION

          After adding secrets, verify they're configured:
          1. Go to: https://github.com/${{ github.repository }}/settings/secrets/actions
          2. Confirm all 4 secrets are listed (values will be masked)
          3. Run the "Build APK" workflow to test

          ════════════════════════════════════════════════════════════
          EOF
          
          cat SETUP_SECRETS.txt

      - name: Keystore Generation Summary
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║        ✅ KEYSTORE GENERATED SUCCESSFULLY                 ║"
          echo "╚════════════════════════════════════════════════════════════╝"
          echo ""
          echo "🔐 KEYSTORE DETAILS"
          echo "────────────────────────────────────────────────────────────"
          echo "  File:        app/release.jks"
          echo "  Alias:       ${{ github.event.inputs.keystore_alias }}"
          echo "  Validity:    ${{ github.event.inputs.validity_days }} days"
          echo "  Algorithm:   RSA 2048-bit"
          echo ""
          echo "📋 CERTIFICATE INFORMATION"
          echo "────────────────────────────────────────────────────────────"
          echo "  CN: ${{ github.event.inputs.common_name }}"
          echo "  O:  ${{ github.event.inputs.organization }}"
          echo "  OU: ${{ github.event.inputs.organization_unit }}"
          echo "  L:  ${{ github.event.inputs.locality }}"
          echo "  S:  ${{ github.event.inputs.state }}"
          echo "  C:  ${{ github.event.inputs.country }}"
          echo ""
          echo "📤 COMMITTED FILES"
          echo "────────────────────────────────────────────────────────────"
          echo "  ✅ app/release.jks"
          echo "  ✅ KEYSTORE_INFO.md"
          echo "  ✅ .gitignore (updated)"
          echo ""
          echo "🔑 GITHUB SECRETS REQUIRED"
          echo "────────────────────────────────────────────────────────────"
          echo "  1. KEYSTORE_BASE64"
          echo "  2. KEYSTORE_ALIAS"
          echo "  3. KEYSTORE_PASSWORD"
          echo "  4. KEY_PASSWORD"
          echo ""
          echo "🚀 NEXT STEPS"
          echo "────────────────────────────────────────────────────────────"
          echo "  1. Go to repository Settings → Secrets and variables"
          echo "  2. Add the 4 secrets from the output above"
          echo "  3. Read KEYSTORE_INFO.md for detailed setup instructions"
          echo "  4. Run 'Build APK' workflow to test signing"
          echo ""
          echo "📝 DOCUMENTATION"
          echo "────────────────────────────────────────────────────────────"
          echo "  - KEYSTORE_INFO.md  : Complete keystore information"
          echo "  - SETUP_SECRETS.txt : Quick reference for secrets setup"
          echo ""
          echo "⚠️  SECURITY REMINDERS"
          echo "────────────────────────────────────────────────────────────"
          echo "  ✓ Keystore file (release.jks) is committed to repository"
          echo "  ✓ NEVER add passwords to .gitignore or commit history"
          echo "  ✓ Store passwords only in GitHub Secrets"
          echo "  ✓ Backup keystore securely offline"
          echo "  ✓ Restrict repository access to authorized developers"
          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "🎉 Keystore setup complete! Now add the secrets."
          echo "════════════════════════════════════════════════════════════"

      - name: Upload Setup Instructions
        uses: actions/upload-artifact@v3
        with:
          name: keystore-setup-instructions
          path: SETUP_SECRETS.txt
          retention-days: 7

      - name: Create Workflow Summary
        run: |
          echo "## ✅ Keystore Generated Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 Generated Files" >> $GITHUB_STEP_SUMMARY
          echo "- \`app/release.jks\` - Keystore file" >> $GITHUB_STEP_SUMMARY
          echo "- \`KEYSTORE_INFO.md\` - Complete documentation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔑 Secrets to Add" >> $GITHUB_STEP_SUMMARY
          echo "1. **KEYSTORE_BASE64** - (Base64 encoded keystore)" >> $GITHUB_STEP_SUMMARY
          echo "2. **KEYSTORE_ALIAS** - \`${{ github.event.inputs.keystore_alias }}\`" >> $GITHUB_STEP_SUMMARY
          echo "3. **KEYSTORE_PASSWORD** - (Your password)" >> $GITHUB_STEP_SUMMARY
          echo "4. **KEY_PASSWORD** - (Your password)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to [Settings → Secrets](https://github.com/${{ github.repository }}/settings/secrets/actions)" >> $GITHUB_STEP_SUMMARY
          echo "2. Add all 4 secrets" >> $GITHUB_STEP_SUMMARY
          echo "3. Read \`KEYSTORE_INFO.md\` for details" >> $GITHUB_STEP_SUMMARY