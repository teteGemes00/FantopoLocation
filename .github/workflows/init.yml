      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          echo "✅ Git configured"

      - name: Commit and Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A
          
          if git diff --cached --quiet; then
            echo "ℹ️  No changes to commit"
          else
            git commit -m "chore: Initialize Android Project - ${{ github.event.inputs.project_name }}

          📱 PROJECT
          - Name: ${{ github.event.inputs.project_name }}
          - Package: ${{ github.event.inputs.package_name }}
          - Description: ${{ github.event.inputs.app_description }}

          🛠️  BUILD
          - Language: ${{ github.event.inputs.language }}
          - Gradle DSL: ${{ github.event.inputs.gradle_dsl }}
          - JDK: ${{ github.event.inputs.jdk_version }}
          - SDK: ${{ github.event.inputs.min_sdk }}-35

          👤 AUTHOR
          - Name: ${{ github.event.inputs.author_name }}
          - Domain: ${{ github.event.inputs.company_domain }}"
            
            git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
            
            echo "✅ Changes committed and pushed successfully"
          fi

